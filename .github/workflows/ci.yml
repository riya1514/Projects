name: CareBridge CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t carebridge-backend ./backend

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build -t carebridge-frontend ./frontend

  build-admin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Admin Docker Image
        run: docker build -t carebridge-admin ./admin
