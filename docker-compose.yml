services:

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  admin:
    build: ./admin
    ports:
      - "5174:5174"
    depends_on:
      - backend